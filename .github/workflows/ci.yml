name: CI

# 两套代码两套测试：内核是 Python（零依赖），插件是 JS（零依赖）。
# 谁都不许因为「另一边过了」就跳过自己那半。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 内核刻意零第三方依赖，所以这里不装任何包——装了反而会掩盖「偷偷 import 了 requests」
      - name: 跑单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 命令行冒烟
        run: |
          python -m regiongate persona --seed 20261019
          python -m regiongate check

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: plugins/iamchinese
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 跑单元测试
        run: npm test

      - name: 打包（dist 里那套产线也跟着跑一遍）
        run: npm run dist

      - name: 冒烟：CLI 装得上、认得出
        run: |
          node bin/iamchinese.mjs persona --seed 20261019 | head -5
          node bin/iamchinese.mjs persona --json | head -3

  qr:
    name: 二维码真能被扫出来
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 OpenCV（唯一允许联网的一步）
        run: python -m pip install --quiet numpy opencv-python-headless

      # 结构测试证明「按规范画了」，这里用真解码器证明「扫得出来」——两件事不一样
      - name: 验 12 条边界用例
        working-directory: plugins/iamchinese
        run: python scripts/verify-qr.py

      - name: 验仓库里那张码
        run: |
          python plugins/iamchinese/scripts/verify-qr.py \
            --png assets/qr-repo.png \
            --expect https://github.com/lirenjie95/IamChinese
