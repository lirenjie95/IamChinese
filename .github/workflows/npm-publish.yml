name: npm publish

# 本机发不出去时走这条：runner 只碰 registry.npmjs.org 的 API，
# 不经过 www.npmjs.com 的 Cloudflare 挑战页。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 关键：这一行才会生成 ~/.npmrc 里那行
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}。
          # 少了它，光设 NODE_AUTH_TOKEN 环境变量 npm 是不认的——报 ENEEDAUTH。
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查 NPM_TOKEN 是否就位
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::仓库没有配 secret NPM_TOKEN，本次只跑测试不发布"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # 发出去就收不回来，所以两套测试都在发布之前跑
      - name: 测试（内核）
        run: python -m unittest discover -s tests -t . -v

      - name: 测试（插件）
        working-directory: plugins/iamchinese
        run: npm test

      - name: 核对版本号与 tag
        if: steps.guard.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/')
        working-directory: plugins/iamchinese
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          echo "package.json=$pkg tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json 版本 $pkg 与 tag $tag 不一致，先改版本号再发"
            exit 1
          fi

      - name: 确认 token 能通过认证
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://registry.npmjs.org/

      - name: 发布
        # 只有打 tag 才真发；手动触发只用来验证 token 和测试，不会把同版本重发一遍
        if: steps.guard.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/')
        working-directory: plugins/iamchinese
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --registry https://registry.npmjs.org/ --access public
